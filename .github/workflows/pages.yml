name: Validate SYSWATCH website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate canonical Pages source
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -s docs/index.html
          test -f docs/styles.css
          test -s docs/styles.css
          test -f docs/logo.svg
          test -s docs/logo.svg

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          site = Path('docs')
          pages = sorted(site.glob('*.html'))
          expected = {
              'index.html', 'features.html', 'security.html',
              'documentation.html', 'download.html', 'about.html'
          }
          actual = {p.name for p in pages}
          missing_pages = sorted(expected - actual)
          if missing_pages:
              raise SystemExit(f'missing required pages: {missing_pages}')

          index = site / 'index.html'
          text = index.read_text(encoding='utf-8')
          required = ('SYSWATCH', 'Ubuntu 24.04', 'local-first', 'GitHub')
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing required site content: {missing}')

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.assets = []
                  self.images = []
                  self.nav_landmarks = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and attrs.get('href'):
                      self.links.append(attrs['href'])
                  for key in ('src', 'href'):
                      value = attrs.get(key)
                      if value and not value.startswith(('http://', 'https://', '#', 'mailto:')):
                          self.assets.append(value.split('#', 1)[0].split('?', 1)[0])
                  if tag == 'img':
                      alt = attrs.get('alt')
                      if alt is None or not alt.strip():
                          raise SystemExit('image missing non-empty alt text')
                      self.images.append(alt)
                  if tag == 'nav' and attrs.get('aria-label') == 'Primary navigation':
                      self.nav_landmarks += 1

          for page in pages:
              parser = LinkParser()
              parser.feed(page.read_text(encoding='utf-8'))
              if parser.nav_landmarks != 1:
                  raise SystemExit(f'{page.name}: expected exactly one labelled primary navigation landmark')
              for href in parser.links + parser.assets:
                  if href.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  target = (page.parent / href).resolve()
                  if site.resolve() not in target.parents and target != site.resolve():
                      raise SystemExit(f'path escapes site root: {page.name}: {href}')
                  if not target.exists():
                      raise SystemExit(f'broken local reference: {page.name}: {href}')

          css = (site / 'styles.css').read_text(encoding='utf-8')
          required_css = ('focus-visible', 'prefers-reduced-motion', '@media(max-width:560px)')
          missing_css = [item for item in required_css if item not in css]
          if missing_css:
              raise SystemExit(f'missing accessibility/responsive CSS contract: {missing_css}')

          print(f'validated {len(pages)} HTML pages, navigation landmarks, images, responsive CSS, and local references')
          PY

      - name: Confirm pre-release deployment remains disabled
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'actions/(configure-pages|deploy-pages|upload-pages-artifact)@' .github/workflows; then
            echo 'Pages deployment action found in repository workflows before release gate cleared' >&2
            exit 1
          fi
