name: SYSWATCH security supply chain

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned release and development audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r requirements-release-audit.txt
      - name: Audit pinned Python dependencies and emit SBOMs
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements-dev.txt --format cyclonedx-json --output dev-dependency-sbom.cdx.json
          python -m pip_audit -r requirements-windows-build.txt --format cyclonedx-json --output windows-build-dependency-sbom.cdx.json
          python -m pip_audit -r requirements-release-audit.txt --format cyclonedx-json --output release-audit-dependency-sbom.cdx.json
          test -s dev-dependency-sbom.cdx.json
          test -s windows-build-dependency-sbom.cdx.json
          test -s release-audit-dependency-sbom.cdx.json
      - name: Preserve supply-chain SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: syswatch-sboms-${{ github.sha }}
          if-no-files-found: error
          path: |
            dev-dependency-sbom.cdx.json
            windows-build-dependency-sbom.cdx.json
            release-audit-dependency-sbom.cdx.json
      - name: Enforce immutable workflow action references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r"^\s*-?\s*uses:\s*[^@\s]+@([^\s#]+)")
          bad = []
          for path in Path('.github/workflows').rglob('*.yml'):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = pattern.match(line)
                  if match and not re.fullmatch(r'[0-9a-fA-F]{40}', match.group(1)):
                      bad.append(f'{path}:{lineno}: {match.group(1)}')
          if bad:
              print('Unpinned GitHub Action references:')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('All GitHub Action references are pinned to full commit SHAs.')
          PY
      - name: Confirm application dependency boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import sys
          allowed = set(sys.stdlib_module_names)
          local_modules = {p.stem for p in Path('syswatch').rglob('*.py')}
          local_modules.update({'syswatch'})
          external = []
          for path in Path('syswatch').rglob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name.split('.')[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module.split('.')[0]]
                  else:
                      continue
                  for name in names:
                      if name not in allowed and name not in local_modules:
                          external.append(f'{path}: {name}')
          if external:
              print('Unexpected non-stdlib application imports:')
              print('\n'.join(sorted(set(external))))
              raise SystemExit(1)
          print('Application runtime imports are stdlib-only; internal modules are allowed; dev/build tooling is not shipped.')
          PY
