name: Build SYSWATCH release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Resolve release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            REF_NAME="${{ inputs.release_tag }}"
          else
            REF_NAME="${GITHUB_REF_NAME}"
          fi
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ref_name=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag points to this repository
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${{ steps.release.outputs.ref_name }}"
          RELEASE_SHA="$(git rev-list -n 1 "refs/tags/${{ steps.release.outputs.ref_name }}")"
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_ENV"
      - name: Validate release tag is exactly current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "$RELEASE_SHA" = "$MAIN_SHA"
          echo "Verified release commit matches origin/main: $MAIN_SHA"
      - name: Set up Python for release validation and SBOM generation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned release validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-release-test.txt
      - name: Run full release test suite on exact tagged commit
        run: python -m pytest -q
      - name: Install pinned release audit dependency
        run: python -m pip install --disable-pip-version-check -r requirements-release-audit.txt
      - name: Generate release build SBOM evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements-windows-build.txt --format cyclonedx-json --output WINDOWS-BUILD-SBOM.cdx.json
          python -m pip_audit -r requirements-release-audit.txt --format cyclonedx-json --output RELEASE-AUDIT-SBOM.cdx.json
          python -m pip_audit -r requirements-release-test.txt --format cyclonedx-json --output RELEASE-TEST-SBOM.cdx.json
          test -s WINDOWS-BUILD-SBOM.cdx.json
          test -s RELEASE-AUDIT-SBOM.cdx.json
          test -s RELEASE-TEST-SBOM.cdx.json
      - name: Build Debian package with shared builder
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build_deb.sh "${{ steps.release.outputs.version }}" "$RELEASE_SHA"
      - name: Verify Debian package and reproducibility
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PACKAGE="syswatch_${VERSION}_amd64.deb"
          SOURCE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          cp "$PACKAGE" first-build.deb
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" >/dev/null
          dpkg-deb --control "$PACKAGE" control
          grep -Fxq 'Package: syswatch' control/control
          grep -Fxq "Version: $VERSION" control/control
          grep -Fxq 'Architecture: amd64' control/control
          grep -Fxq 'Depends: python3, systemd, passwd' control/control
          test -f control/postrm
          grep -q 'User=syswatch' control/postinst
          grep -q 'ProtectSystem=strict' control/postinst
          grep -q 'CapabilityBoundingSet=' control/postinst
          grep -q 'AmbientCapabilities=' control/postinst
          EXPECTED_SUM="$(sha256sum "$PACKAGE")"
          test "$(cat SHA256SUMS)" = "$EXPECTED_SUM"
          sha256sum --check SHA256SUMS
          grep -Fxq "SYSWATCH $VERSION" RELEASE-METADATA.txt
          grep -Fxq "Commit $RELEASE_SHA" RELEASE-METADATA.txt
          grep -Fxq "Source-Date-Epoch $SOURCE_EPOCH" RELEASE-METADATA.txt
          bash packaging/build_deb.sh "$VERSION" "$RELEASE_SHA"
          cmp --silent first-build.deb "$PACKAGE"
          test "$(cat SHA256SUMS)" = "$(sha256sum "$PACKAGE")"
      - name: Verify packaged install lifecycle
        shell: bash
        run: |
          set -euo pipefail
          sudo bash tests/test_debian_lifecycle.sh "$(pwd)/syswatch_${{ steps.release.outputs.version }}_amd64.deb"
      - name: Attest Debian package provenance
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: 'syswatch_*.deb'
      - name: Stage Debian release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: syswatch-linux-release
          if-no-files-found: error
          path: |
            syswatch_*.deb
            SHA256SUMS
            RELEASE-METADATA.txt
            WINDOWS-BUILD-SBOM.cdx.json
            RELEASE-AUDIT-SBOM.cdx.json
            RELEASE-TEST-SBOM.cdx.json

  windows-package:
    needs: package
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Resolve release ref
        id: release
        shell: pwsh
        run: |
          $ref = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { '${{ inputs.release_tag }}' } else { $env:GITHUB_REF_NAME }
          if ($ref -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $ref" }
          "ref_name=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($ref.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Checkout exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag commit identity
        shell: pwsh
        run: |
          $tagSha = (git rev-list -n 1 "refs/tags/${{ steps.release.outputs.ref_name }}").Trim()
          $headSha = (git rev-parse HEAD).Trim()
          if ($tagSha -ne $headSha) { throw "Release tag does not point to checked-out commit" }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Windows build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-windows-build.txt
      - name: Install pinned release audit dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-release-audit.txt
      - name: Generate Windows release SBOM evidence
        shell: pwsh
        run: |
          python -m pip_audit -r requirements-windows-build.txt --format cyclonedx-json --output WINDOWS-BUILD-SBOM.cdx.json
          python -m pip_audit -r requirements-release-audit.txt --format cyclonedx-json --output RELEASE-AUDIT-SBOM-WINDOWS.cdx.json
          python -m pip_audit -r requirements-release-test.txt --format cyclonedx-json --output RELEASE-TEST-SBOM-WINDOWS.cdx.json
          if (!(Test-Path -Path WINDOWS-BUILD-SBOM.cdx.json) -or (Get-Item WINDOWS-BUILD-SBOM.cdx.json).Length -eq 0) { throw 'Windows build SBOM is empty' }
          if (!(Test-Path -Path RELEASE-AUDIT-SBOM-WINDOWS.cdx.json) -or (Get-Item RELEASE-AUDIT-SBOM-WINDOWS.cdx.json).Length -eq 0) { throw 'Windows release audit SBOM is empty' }
          if (!(Test-Path -Path RELEASE-TEST-SBOM-WINDOWS.cdx.json) -or (Get-Item RELEASE-TEST-SBOM-WINDOWS.cdx.json).Length -eq 0) { throw 'Windows release test SBOM is empty' }
      - name: Set deterministic Windows release build environment
        shell: pwsh
        run: |
          $sourceEpoch = (git show -s --format=%ct HEAD).Trim()
          "SOURCE_DATE_EPOCH=$sourceEpoch" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHONHASHSEED=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Reproducible release build epoch: $sourceEpoch"
      - name: Build first one-file Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/syswatch_windows.spec
          Copy-Item (Join-Path $PWD 'dist\syswatch.exe') (Join-Path $PWD 'first-build.exe')
      - name: Rebuild and verify byte-identical Windows executable
        shell: pwsh
        run: |
          $first = Join-Path $PWD 'first-build.exe'
          $firstHash = (Get-FileHash $first -Algorithm SHA256).Hash.ToLowerInvariant()
          Remove-Item -Recurse -Force build, dist
          python -m PyInstaller --clean --noconfirm packaging/syswatch_windows.spec
          $second = Join-Path $PWD 'dist\syswatch.exe'
          $secondHash = (Get-FileHash $second -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($firstHash -ne $secondHash) { throw "Windows release executable rebuild is not reproducible: $firstHash != $secondHash" }
          "Reproducible Windows release executable SHA256: $secondHash"
      - name: Rename and checksum executable
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $source = Join-Path $PWD 'dist\syswatch.exe'
          $target = Join-Path $PWD "syswatch-$version-windows-x64.exe"
          Copy-Item $source $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $target -Leaf)" | Out-File -Encoding ascii SHA256SUMS-WINDOWS
          "Windows executable SHA256: $hash"
      - name: Smoke-test released executable and native Windows telemetry API
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "syswatch-${{ steps.release.outputs.version }}-windows-x64.exe"
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/health' -Headers @{ Host = '127.0.0.1:8080' }
                if ($health.ok -eq $true -and $health.service -eq 'syswatch' -and $health.agent -eq 'online') { $healthy = $true; break }
              } catch {}
            }
            if (!$healthy) { throw 'Windows release executable failed the health contract' }

            $metrics = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/metrics' -Headers @{ Host = '127.0.0.1:8080' }
            if (!$metrics.hostname) { throw 'Windows release hostname telemetry is missing' }
            if ($metrics.platform -notmatch 'Windows') { throw "Native Windows release platform telemetry missing: $($metrics.platform)" }
            if ($metrics.firewall.backend -ne 'windows-defender-firewall') { throw "Native Windows release firewall backend not selected: $($metrics.firewall.backend)" }
            if ($metrics.firewall.status -notin @('ACTIVE', 'REVIEW', 'UNKNOWN')) { throw "Invalid Windows release firewall status: $($metrics.firewall.status)" }
            if ($null -eq $metrics.cpu -or $metrics.cpu -lt 0 -or $metrics.cpu -gt 100) { throw 'Windows release CPU telemetry invalid' }
            if ($null -eq $metrics.memory -or $metrics.memory -lt 0 -or $metrics.memory -gt 100) { throw 'Windows release memory telemetry invalid' }

            $processes = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/processes' -Headers @{ Host = '127.0.0.1:8080' }
            if ($null -eq $processes.processes -or @($processes.processes).Count -lt 1) { throw 'Native Windows release process telemetry is empty' }
            $sample = @($processes.processes)[0]
            if ($null -eq $sample.pid -or !$sample.name) { throw 'Native Windows release process telemetry contract incomplete' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Attest Windows executable provenance
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: 'syswatch-*.exe'
      - name: Stage Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: syswatch-windows-release
          if-no-files-found: error
          path: |
            syswatch-*.exe
            SHA256SUMS-WINDOWS
            WINDOWS-BUILD-SBOM.cdx.json
            RELEASE-AUDIT-SBOM-WINDOWS.cdx.json
            RELEASE-TEST-SBOM-WINDOWS.cdx.json

  publish:
    needs: [package, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            REF_NAME="${{ inputs.release_tag }}"
          else
            REF_NAME="${GITHUB_REF_NAME}"
          fi
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "ref_name=$REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Download Debian release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: syswatch-linux-release
          path: release
      - name: Download Windows release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: syswatch-windows-release
          path: release
      - name: Verify staged release contents
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name 'syswatch_*.deb' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name 'syswatch-*.exe' | wc -l)" -eq 1
          test -f release/SHA256SUMS
          test -f release/SHA256SUMS-WINDOWS
          test -f release/RELEASE-METADATA.txt
          test -f release/WINDOWS-BUILD-SBOM.cdx.json
          test -f release/RELEASE-AUDIT-SBOM.cdx.json
          test -f release/RELEASE-TEST-SBOM.cdx.json
          test -f release/RELEASE-AUDIT-SBOM-WINDOWS.cdx.json
          test -f release/RELEASE-TEST-SBOM-WINDOWS.cdx.json
          (
            cd release
            sha256sum --check SHA256SUMS
            sha256sum --check SHA256SUMS-WINDOWS
          )
      - name: Create verified release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release.outputs.ref_name }}
          generate_release_notes: true
          files: |
            release/syswatch_*.deb
            release/SHA256SUMS
            release/SHA256SUMS-WINDOWS
            release/RELEASE-METADATA.txt
            release/syswatch-*.exe
            release/WINDOWS-BUILD-SBOM.cdx.json
            release/RELEASE-AUDIT-SBOM.cdx.json
            release/RELEASE-AUDIT-SBOM-WINDOWS.cdx.json
            release/RELEASE-TEST-SBOM.cdx.json
            release/RELEASE-TEST-SBOM-WINDOWS.cdx.json
