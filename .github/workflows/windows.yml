name: SYSWATCH Windows validation

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-executable:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-windows-build.txt
      - name: Set deterministic Windows build environment
        shell: pwsh
        run: |
          $sourceEpoch = (git show -s --format=%ct HEAD).Trim()
          "SOURCE_DATE_EPOCH=$sourceEpoch" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYTHONHASHSEED=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Reproducible build epoch: $sourceEpoch"
      - name: Build first one-file executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/syswatch_windows.spec
          Copy-Item (Join-Path $PWD 'dist\syswatch.exe') (Join-Path $PWD 'first-build.exe')
      - name: Rebuild and verify byte-identical executable
        shell: pwsh
        run: |
          $first = Join-Path $PWD 'first-build.exe'
          $firstHash = (Get-FileHash $first -Algorithm SHA256).Hash.ToLowerInvariant()
          Remove-Item -Recurse -Force build, dist
          python -m PyInstaller --clean --noconfirm packaging/syswatch_windows.spec
          $second = Join-Path $PWD 'dist\syswatch.exe'
          $secondHash = (Get-FileHash $second -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($firstHash -ne $secondHash) { throw "Windows executable rebuild is not reproducible: $firstHash != $secondHash" }
          "SYSWATCH reproducible Windows executable SHA256: $secondHash"
      - name: Smoke-test executable and native Windows telemetry API
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\syswatch.exe'
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/health' -Headers @{ Host = '127.0.0.1:8080' }
                if ($health.ok -eq $true -and $health.service -eq 'syswatch' -and $health.agent -eq 'online') { $healthy = $true; break }
              } catch {}
            }
            if (!$healthy) { throw 'Windows executable did not expose the expected local health contract' }

            $metrics = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/metrics' -Headers @{ Host = '127.0.0.1:8080' }
            if (!$metrics.hostname) { throw 'Windows hostname telemetry is missing' }
            if ($metrics.platform -notmatch 'Windows') { throw "Native Windows platform telemetry missing: $($metrics.platform)" }
            if ($metrics.firewall.backend -ne 'windows-defender-firewall') { throw "Native Windows firewall backend not selected: $($metrics.firewall.backend)" }
            if ($metrics.firewall.status -notin @('ACTIVE', 'REVIEW', 'UNKNOWN')) { throw "Invalid Windows firewall status: $($metrics.firewall.status)" }
            if ($null -eq $metrics.cpu -or $metrics.cpu -lt 0 -or $metrics.cpu -gt 100) { throw 'Windows CPU telemetry invalid' }
            if ($null -eq $metrics.memory -or $metrics.memory -lt 0 -or $metrics.memory -gt 100) { throw 'Windows memory telemetry invalid' }

            $processes = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/api/processes' -Headers @{ Host = '127.0.0.1:8080' }
            if ($null -eq $processes.processes -or @($processes.processes).Count -lt 1) { throw 'Native Windows process telemetry is empty' }
            $sample = @($processes.processes)[0]
            if ($null -eq $sample.pid -or !$sample.name) { throw 'Native Windows process telemetry contract incomplete' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
